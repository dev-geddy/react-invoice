# @spec L2-DEVOPS-08, L2-DEVOPS-24
# Thin wrapper over devops/deploy-for-pm2-build-locally.sh: the build runs on
# the Actions runner (typecheck → build → pack), only the assembled artifact
# ships to the droplet; migrations run from the runner via an ssh tunnel.
# ubuntu-latest is glibc like the droplet, so the traced node_modules match.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST       - droplet host/IP
#   DEPLOY_DOMAIN     - instance domain (deploy dir /var/www/<domain>)
#   DEPLOY_SSH_KEY    - private SSH key, no passphrase
#   DEPLOY_ENV        - optional, full contents of .env (first deploy / env changes only)
#   DEPLOY_ENV_LOCAL  - optional, full contents of .env.local (first deploy / env changes only)
name: Deploy

on:
  workflow_dispatch: {}
  # push:
  #   branches: [master]

# Least privilege: this workflow never calls the GitHub API, only checks out.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # The build-locally flow refuses without local deps — install them here.
      - name: Install dependencies
        run: corepack yarn install --immutable

      # Secrets are passed via env (not interpolated into the script text), so a
      # secret containing shell metacharacters can't inject commands.
      - name: Write SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > key.pem
          chmod 600 key.pem

      - name: Build deploy args
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          DEPLOY_ENV_LOCAL: ${{ secrets.DEPLOY_ENV_LOCAL }}
        run: |
          ARGS=""
          if [ -n "$DEPLOY_ENV" ]; then
            printf '%s' "$DEPLOY_ENV" > env.deploy
            ARGS="$ARGS --env env.deploy"
          fi
          if [ -n "$DEPLOY_ENV_LOCAL" ]; then
            printf '%s' "$DEPLOY_ENV_LOCAL" > env.local.deploy
            ARGS="$ARGS --env-local env.local.deploy"
          fi
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: ./devops/deploy-for-pm2-build-locally.sh -h "$DEPLOY_HOST" -i key.pem -d "$DEPLOY_DOMAIN" $ARGS
