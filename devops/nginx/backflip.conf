# @spec L2-DEVOPS-05, L2-MCP-30, L2-MCP-33
# nginx site template for the pm2 droplet flavor. setup-droplet-for-pm2.sh
# renders __DOMAIN__/__PORT__ and installs it as
# /etc/nginx/sites-available/<app-name>.conf — one site per instance.
# certbot --nginx later injects the TLS listener + http->https redirect.
# The http-context zones/log_format referenced here (backflip_auth,
# backflip_oauth, backflip_scrubbed) come from /etc/nginx/conf.d/backflip-http.conf
# (see backflip-http.conf).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Don't advertise the nginx version in responses / error pages.
    server_tokens off;

    # Access log with reset/verify tokens redacted (L2-DEVOPS-23).
    access_log /var/log/nginx/access.log backflip_scrubbed;

    # Throttle the credentials login endpoint at the edge (L2-DEVOPS-22). Scoped
    # to this exact path so session/csrf polling under /api/auth/* is untouched.
    location = /api/auth/callback/credentials {
        limit_req zone=backflip_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Throttle the OAuth connector endpoints at the edge (L2-MCP-30), on top
    # of the app's in-process limiter. DCR (register) is unauthenticated by
    # design (RFC 7591) and the token endpoint is hit on every refresh, so
    # both get the same edge zone as a defense-in-depth backstop.
    location = /api/oauth/token {
        limit_req zone=backflip_oauth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/oauth/register {
        limit_req zone=backflip_oauth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable HTTP endpoint. NOT rate-limited at the edge — it's
    # per-token limited in the app (L2-MCP-30) — but needs streaming-friendly
    # proxying so tool responses aren't buffered/cut off.
    location = /api/mcp {
        # Bearer token auth depends on this reaching the app. nginx passes
        # Authorization through by default; set explicitly to make that
        # dependency visible.
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
